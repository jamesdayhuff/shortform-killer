<!doctype html>
<meta charset="utf-8">
<title>Shortform Killer</title>
<link rel="stylesheet" href="popup.css">
<div class="wrap">
  <div class="head">
    <span class="mark" aria-hidden="true"></span>
    <h1>Shortform Killer</h1>
  </div>

  <div class="rows">
    <label class="row" for="toggle-youtube">
      <span class="site youtube" aria-hidden="true"></span>
      <span class="label">
        <span class="title">YouTube Shorts</span>
        <span class="state" id="state-youtube">Loading…</span>
      </span>
      <input type="checkbox" id="toggle-youtube" role="switch" data-site="youtube">
      <span class="switch" aria-hidden="true"></span>
    </label>

    <label class="row" for="toggle-facebook">
      <span class="site facebook" aria-hidden="true"></span>
      <span class="label">
        <span class="title">Facebook Reels</span>
        <span class="state" id="state-facebook">Loading…</span>
      </span>
      <input type="checkbox" id="toggle-facebook" role="switch" data-site="facebook">
      <span class="switch" aria-hidden="true"></span>
    </label>
  </div>

  <p class="foot">Whatever is switched on gets hidden from the feed and
    search, and its <code>/shorts/</code> or <code>/reel/</code> links get
    intercepted.</p>
</div>
<script src="popup.js"></script>
